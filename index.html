<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiSE</title>
<meta name="description" content="Rules-engine prompt compiler for Seedance 2.0 and 2.5. RU/EN. Runs in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0d0c;--card:#151412;--card2:#1b1917;--line:#2a2724;--text:#ece7e1;--mute:#8d867e;
  --acc:#ff6a1a;--acc-d:#c9500f;--ok:#6fcf97;--warn:#f2c94c;--err:#eb5757;--info:#7aa2f7;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--mono);-webkit-font-smoothing:antialiased;padding-bottom:84px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header{padding:56px 0 20px;text-align:center}
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin:0 0 14px}
h1{font:700 clamp(36px,7vw,68px)/1.05 var(--serif);margin:0 0 30px;letter-spacing:-.01em}
.sub{max-width:720px;color:var(--mute);margin:0 0 26px;font-size:13.5px}
.lang{position:fixed;top:14px;right:14px;z-index:20;display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{all:unset;cursor:pointer;font-size:11px;letter-spacing:.1em;padding:5px 12px;border-radius:999px;color:var(--mute)}
.lang button[aria-pressed=true]{background:var(--acc);color:#120a04;font-weight:700}
.bar{justify-content:center;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{all:unset;cursor:pointer;padding:9px 18px;font-size:13px;color:var(--mute);transition:.15s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--acc);color:#120a04;font-weight:700}
.lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-right:10px}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;font-size:12.5px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button[aria-pressed=true]{color:var(--acc);border-bottom-color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr;gap:18px;padding:22px 0}
@media(min-width:980px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px}.sticky{position:sticky;top:14px;align-self:start;max-height:calc(100vh - 28px);overflow:auto}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
label{display:block;font-size:11.5px;color:var(--mute);margin:12px 0 5px}
label:first-of-type{margin-top:0}
textarea,input[type=text],input[type=number],select{-webkit-appearance:none;appearance:none;border-radius:9px;width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:13px/1.5 var(--mono);outline:none;transition:border-color .15s}
textarea{resize:vertical;min-height:110px}
textarea:focus,input:focus,select:focus{border-color:var(--acc)}
select{-webkit-appearance:none;-moz-appearance:none;appearance:none;background-color:var(--bg);background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.dur{display:grid;grid-template-columns:1fr 78px;gap:12px;align-items:center}
input[type=range]{width:100%;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:999px;padding:5px 11px;font-size:11.5px;text-decoration:none}
button.chip{cursor:pointer;font-family:var(--mono)}
button.chip:hover,a.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip b{color:var(--acc);font-weight:600}
.chip.dim{color:var(--mute)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:9px;background:var(--acc);color:#120a04;font:700 12.5px var(--mono);transition:.15s}
.btn:hover{background:#ff8340}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn:focus-visible,.seg button:focus-visible,.tabs button:focus-visible,.lang button:focus-visible,.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chk{display:flex;gap:9px;align-items:flex-start;margin:10px 0 0;color:var(--text);font-size:12.5px;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--acc)}
.ref{display:grid;grid-template-columns:70px minmax(130px,1.1fr) minmax(0,1.3fr) 32px;gap:8px;align-items:center;margin-bottom:8px}
.ref .tok{font-size:11.5px;color:var(--acc)}
.ref .x{all:unset;cursor:pointer;color:var(--mute);text-align:center;font-size:18px;line-height:1}
.ref .x:hover{color:var(--err)}
@media(max-width:560px){.ref{grid-template-columns:62px 1fr 28px}.ref input{grid-column:1/-1;grid-row:2}.row{grid-template-columns:1fr}}
.hint{font-size:11.5px;color:var(--mute);margin:8px 0 0}
pre.out{margin:0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.65 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:560px;overflow:auto;user-select:text}
.stats{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--mute);margin:10px 0 6px;flex-wrap:wrap}
.meter{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);transition:width .2s}
.meter.over i{background:var(--err)}
.tl{display:flex;gap:3px;height:54px;margin-bottom:14px}
.tl div{background:linear-gradient(180deg,rgba(255,106,26,.28),rgba(255,106,26,.12));border:1px solid rgba(255,106,26,.45);border-radius:7px;padding:5px 7px;min-width:0;overflow:hidden;font-size:10.5px;line-height:1.3}
.tl b{display:block;color:var(--acc)}
.tl span{color:var(--mute);white-space:nowrap;text-overflow:ellipsis;overflow:hidden;display:block}
.shot{border-top:1px solid var(--line);padding:10px 0;font-size:12.5px}
.shot .t{color:var(--acc);margin-right:8px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.list li:first-child{border-top:0}
.dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--info)}
.dot.err{background:var(--err)}.dot.warn{background:var(--warn)}.dot.tip{background:var(--info)}.dot.info{background:var(--mute)}
.score{font:700 12px var(--mono);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.score.hi{color:var(--ok);border-color:var(--ok)}.score.mid{color:var(--warn);border-color:var(--warn)}.score.lo{color:var(--err);border-color:var(--err)}
.empty{color:var(--mute);font-size:13px;padding:22px 4px;text-align:center}
.hist{display:grid;gap:10px}
.hist .it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.hist .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mute);align-items:center}
.badge{border:1px solid var(--acc);color:var(--acc);border-radius:6px;padding:1px 7px;font-size:10.5px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--acc);color:#120a04;font-weight:700;font-size:12.5px;padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
.back{position:fixed;right:16px;bottom:16px;z-index:10;background:var(--card);border:1px solid var(--line);color:var(--mute);text-decoration:none;font-size:12px;padding:8px 14px;border-radius:999px}
.back:hover{color:var(--acc);border-color:var(--acc)}
.foot{color:var(--mute);font-size:11.5px;padding:10px 0 30px;max-width:760px}
[hidden]{display:none!important}
::selection{background:var(--acc);color:#120a04}

select::-ms-expand{display:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
@media(max-width:700px){textarea,input[type=text],input[type=number],select{font-size:16px}}

</style>
</head>
<body>
<div class="lang" role="group" aria-label="Language">
  <button type="button" data-l="en" aria-pressed="true">EN</button>
  <button type="button" data-l="ru" aria-pressed="false">RU</button>
</div>

<main class="wrap">
  <header>
    <p class="kicker" data-t="kicker"></p>
    <h1 id="title">MiSE</h1>
    <div class="bar">
      <div><span class="lbl" data-t="ver"></span>
        <span class="seg" id="verSeg" role="group"><button type="button" data-v="2.0" aria-pressed="false">Seedance 2.0</button><button type="button" data-v="2.5" aria-pressed="true">Seedance 2.5</button></span>
      </div>
      <nav class="tabs" id="modeTabs">
        <button type="button" data-m="compile" aria-pressed="true" data-t="tab_compile"></button>
        <button type="button" data-m="improve" aria-pressed="false" data-t="tab_improve"></button>
        <button type="button" data-m="history" aria-pressed="false" data-t="tab_hist"></button>
      </nav>
    </div>
  </header>

  <!-- COMPILE -->
  <section id="pane-compile" class="grid">
    <div class="col">
      <div class="card">
        <h2><span data-t="c_brief"></span></h2>
        <label for="desc" data-t="f_desc"></label>
        <textarea id="desc" data-tp="ph_desc" spellcheck="false"></textarea>
        <label data-t="ex"></label>
        <div class="chips" id="examples"></div>
        <div class="row" style="margin-top:14px">
          <div><label for="durNum" data-t="f_dur"></label>
            <div class="dur"><input type="range" id="dur" min="4" max="30" step="1" value="10"><input type="number" id="durNum" min="4" max="30" value="10"></div></div>
          <div><label for="ratio" data-t="f_ratio"></label><select id="ratio"></select>
            <input type="text" id="ratioCustom" placeholder="3:2" style="margin-top:8px" hidden></div>
        </div>
        <label for="arch" data-t="f_arch"></label><select id="arch"></select>
      </div>

      <div class="card">
        <h2><span data-t="c_look"></span></h2>
        <div class="row3">
          <div><label for="detail" data-t="f_detail"></label><select id="detail"><option value="lean" data-t="d_lean"></option><option value="std" data-t="d_std" selected></option><option value="rich" data-t="d_rich"></option></select></div>
          <div><label for="cons" data-t="f_cons"></label><select id="cons"><option value="1" data-t="k1"></option><option value="2" data-t="k2" selected></option><option value="3" data-t="k3"></option></select></div>
          <div><label for="body" data-t="f_body"></label><select id="body"></select></div>
          <div><label for="light" data-t="f_light"></label><select id="light"></select></div>
          <div><label for="move" data-t="f_move"></label><select id="move"></select></div>
        </div>
      </div>

      <div class="card">
        <h2><span data-t="c_refs"></span><span class="hint" id="refCount" style="margin:0"></span></h2>
        <div id="refs"></div>
        <button type="button" class="btn ghost sm" id="addRef" data-t="add_ref"></button>
        <p class="hint" data-t="refs_hint"></p>
      </div>

      <div class="card">
        <h2><span data-t="c_audio"></span></h2>
        <div class="row">
          <div><label for="music" data-t="f_music"></label><input type="text" id="music" data-tp="ph_music"></div>
          <div><label for="sfx" data-t="f_sfx"></label><input type="text" id="sfx" data-tp="ph_sfx"></div>
        </div>
        <label for="dialogue" data-t="f_dlg"></label>
        <textarea id="dialogue" style="min-height:64px" data-tp="ph_dlg"></textarea>
        <label for="dlang" data-t="f_dlang"></label>
        <select id="dlang"><option value="auto" data-t="dl_auto"></option><option value="en">English</option><option value="ru">Russian</option><option value="ruuk" data-t="dl_ruuk"></option><option value="zh">Mandarin Chinese</option><option value="es">Spanish</option><option value="de">German</option><option value="fr">French</option></select>
        <label class="chk"><input type="checkbox" id="nosubs" checked><span data-t="o_nosubs"></span></label>
        <label class="chk"><input type="checkbox" id="nobgm"><span data-t="o_nobgm"></span></label>
        <label class="chk"><input type="checkbox" id="brackets" checked><span data-t="o_brackets"></span></label>
      </div>

      <div class="card">
        <h2><span data-t="c_opts"></span></h2>
        <label class="chk" id="timesWrap"><input type="checkbox" id="times" checked><span data-t="o_times"></span></label>
        <label class="chk" id="endWrap"><input type="checkbox" id="endState" checked><span data-t="o_end"></span></label>
        <label for="neg" data-t="f_neg"></label>
        <input type="text" id="neg" data-tp="ph_neg">
      </div>
    </div>

    <div class="col sticky">
      <div class="card">
        <h2><span data-t="c_und"></span></h2>
        <div class="chips" id="understood"></div>
      </div>

      <div class="card">
        <h2><nav class="tabs" id="outTabs" style="margin:-6px 0 -8px">
          <button type="button" data-o="prompt" aria-pressed="true" data-t="o_prompt"></button>
          <button type="button" data-o="tl" aria-pressed="false" data-t="o_tl"></button>
          <button type="button" data-o="llm" aria-pressed="false" data-t="o_llm"></button>
          <button type="button" data-o="json" aria-pressed="false" data-t="o_json"></button></nav></h2>
        <div id="o-prompt"><pre class="out" id="outPrompt"></pre>
          <div class="stats"><span id="stats"></span><span id="limit"></span></div><div class="meter" id="meter"><i></i></div></div>
        <div id="o-tl" hidden><div class="tl" id="tlBar"></div><div id="tlList"></div></div>
        <div id="o-llm" hidden><p class="hint" style="margin:0 0 10px" data-t="llm_hint"></p><pre class="out" id="outLlm"></pre></div>
        <div id="o-json" hidden><pre class="out" id="outJson"></pre></div>
        <div class="acts">
          <button type="button" class="btn" id="bCopy" data-t="btn_copy"></button>
          <button type="button" class="btn ghost" id="bTxt" data-t="btn_txt"></button>
          <button type="button" class="btn ghost" id="bJson" data-t="btn_json"></button>
          <button type="button" class="btn ghost" id="bLink" data-t="btn_link"></button>
          <button type="button" class="btn ghost" id="bSave" data-t="btn_save"></button>
        </div>
      </div>

      <div class="card">
        <h2><span data-t="c_audit"></span><span class="score" id="score"></span></h2>
        <ul class="list" id="issues"></ul>
      </div>
      <div class="card" id="notesCard">
        <h2><span data-t="c_notes"></span></h2>
        <ul class="list" id="notes"></ul>
      </div>
    </div>
  </section>

  <!-- IMPROVE -->
  <section id="pane-improve" class="grid" hidden>
    <div class="col">
      <div class="card">
        <h2><span data-t="imp_h"></span></h2>
        <textarea id="impText" style="min-height:280px" data-tp="ph_imp" spellcheck="false"></textarea>
        <label for="impDur" data-t="imp_dur"></label>
        <input type="number" id="impDur" min="0" max="30" style="max-width:120px">
        <div class="acts">
          <button type="button" class="btn ghost" id="impStrip" data-t="imp_strip"></button>
          <button type="button" class="btn ghost" id="impCons" data-t="imp_cons"></button>
          <button type="button" class="btn" id="impCopy" data-t="btn_copy"></button>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card"><h2><span data-t="c_audit"></span><span class="score" id="impScore"></span></h2><ul class="list" id="impIssues"></ul></div>
      <div class="card"><h2><span data-t="imp_llm"></span></h2><pre class="out" id="impMeta"></pre>
        <div class="acts"><button type="button" class="btn ghost" id="impMetaCopy" data-t="btn_copy"></button></div></div>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="pane-history" hidden style="padding:22px 0">
    <div class="acts" style="margin:0 0 16px">
      <label class="chk" style="margin:0"><input type="checkbox" id="favOnly"><span data-t="h_only_fav"></span></label>
      <button type="button" class="btn ghost sm" id="histClear" data-t="h_clear"></button>
    </div>
    <div class="hist" id="hist"></div>
  </section>

  <p class="foot" data-t="foot"></p>
</main>

<a class="back" id="backLink" href="../" data-t="back"></a>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== RULES BASE: limits, roles, archetypes, light, camera, slop ===== */

// Hard facts per version (official guides + community; chars = soft recommendation)
const LIM = {
  '2.0': { min: 4, max: 15, img: 9, vid: 3, aud: 3, total: 12, chars: 3500, maxShots: 5,
           ratios: ['16:9', '9:16', '1:1', '4:3', '3:4', '21:9'] },
  '2.5': { min: 4, max: 30, img: 30, vid: 10, aud: 10, total: 50, chars: 6000, maxShots: 10,
           ratios: ['16:9', '9:16', '1:1', '4:3', '3:4', '21:9', '2:1', '5:2', '2:5'] }
};

// Reference roles. Each returns one complete sentence for the @-token.
const ROLES = {
  character: { kind: 'image', l: ['Character', 'Персонаж'],
    f: (r, n) => `${r} as the character${n}: strict identity preservation, exact face, hairstyle and outfit, no morphing.` },
  product:   { kind: 'image', l: ['Product', 'Продукт'],
    f: (r, n) => `${r} as the product${n}: exact shape, colour, proportions and logo placement, no redesign.` },
  scene:     { kind: 'image', l: ['Location', 'Локация'],
    f: (r, n) => `${r} as the location reference${n}: keep the layout, architecture and key props.` },
  prop:      { kind: 'image', l: ['Prop / object', 'Предмет'],
    f: (r, n) => `${r} as a prop${n}: keep its exact shape and material.` },
  style:     { kind: 'image', l: ['Style only', 'Только стиль'],
    f: (r, n) => `${r} as a visual style reference only${n}: take palette, texture and lighting mood, do not copy its subject.` },
  first:     { kind: 'image', l: ['First frame', 'Первый кадр'],
    f: (r, n) => `${r} as the first frame${n}.` },
  last:      { kind: 'image', l: ['Last frame', 'Последний кадр'],
    f: (r, n) => `${r} as the last frame${n}; the motion must resolve into it.` },
  vmotion:   { kind: 'video', l: ['Motion / camera only', 'Только движение/камера'],
    f: (r, n) => `${r} as camera and motion reference only${n}: do not inherit its actor, clothing, background, captions or music.` },
  vedit:     { kind: 'video', ver: '2.5', l: ['Source clip to edit', 'Клип для правки'],
    f: (r, n) => `${r} is the source clip to edit${n}: keep everything unchanged except the requested change.` },
  vextend:   { kind: 'video', ver: '2.5', l: ['Extend this clip', 'Продолжить клип'],
    f: (r, n) => `${r}: extend from its final frame${n}, keeping the same subject, setting, lighting and motion direction.` },
  music:     { kind: 'audio', l: ['Music', 'Музыка'],
    f: (r, n) => `${r} as background music${n}: sync cuts and key actions to its beat, no other music.` },
  voice:     { kind: 'audio', l: ['Voice', 'Голос'],
    f: (r, n) => `${r} as the voice reference${n}: match timbre and pacing for the character's dialogue.` },
  sfx:       { kind: 'audio', l: ['Sound effects', 'Звуковые эффекты'],
    f: (r, n) => `${r} as the sound-effects reference${n}.` }
};

// Camera bodies and look blocks (anti-"plastic" vocabulary from the expensive-look reference)
const BODY = {
  arri:  'Shot on ARRI Alexa 35 with Cooke S4 lenses, 32mm T2.0',
  red:   'Shot on RED V-Raptor with Sigma Cine Prime 40mm T1.5',
  sony:  'Shot on Sony Venice 2 with Zeiss Supreme Prime 50mm T1.5',
  ana:   'Shot on ARRI Alexa 35 with anamorphic lenses, 2.39:1 look, oval bokeh and horizontal flares',
  phone: 'Shot on a modern smartphone, natural handheld framing',
  none:  ''
};
const BLOCK = {

const hitCount = (text, list) => list.reduce((n, s) => n + (stemRe(s).test(text) ? 1 : 0), 0);
const firstIdx = (text, list) => { let best = -1; for (const s of list) { const m = stemRe(s).exec(text); if (m && (best < 0 || m.index < best)) best = m.index; } return best; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const lowFirst = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : s;
const dot = s => /[.!?…]$/.test(s) ? s : s + '.';
const words = s => (s.match(/[\p{L}\p{N}'-]+/gu) || []).length;
const pick = (arr, i, n) => !arr.length ? '' : (n <= 1 ? arr[0] : arr[Math.round(i * (arr.length - 1) / (n - 1))]);

// Largest-remainder allocation of `total` whole seconds across weights, each at least `min`
function allocate(weights, total, min) {
  const n = weights.length, rest = total - min * n;
  if (rest < 0) return null;
  const sum = weights.reduce((a, b) => a + b, 0) || n;
  const raw = weights.map(w => rest * w / sum);
  const fl = raw.map(Math.floor);
  let left = rest - fl.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - Math.floor(r), i]).sort((a, b) => b[0] - a[0]).slice(0, left).forEach(([, i]) => fl[i]++);
  return fl.map(f => f + min);
}

function parseRatio(str) {
  const m = /^\s*(\d+(?:\.\d+)?)\s*[:/xх]\s*(\d+(?:\.\d+)?)\s*$/.exec(str || '');
  if (!m) return null;
  const w = +m[1], h = +m[2];
  return h > 0 && w > 0 ? { w, h, v: w / h, s: `${m[1]}:${m[2]}` } : null;
}

/* ---------- 1. Decode the brief ---------- */
function decode(text) {
  const I = { beats: [], moves: [], weather: null, tod: null, interior: false, ratio: null, dur: null, arch: null, scores: [], conf: 0, lang: 'en', userTimes: false };
  const cyr = (text.match(/[а-яё]/gi) || []).length, lat = (text.match(/[a-z]/gi) || []).length;
  I.lang = cyr > lat ? 'ru' : 'en';

  // duration hint (ignore the "5s" tail of a timestamp range)
  const dm = /(?<![\d.]\s?[-–—]\s?)(?<![\d.])(\d{1,2})\s*(?:сек\p{L}*|с(?![\p{L}])|s(?![\p{L}])|sec\p{L}*|second\p{L}*)/iu.exec(text);
  if (dm) I.dur = +dm[1];

  // scene type
  I.scores = ARCH.map(a => ({ a, s: hitCount(text, a.kw) })).sort((x, y) => y.s - x.s);
  const total = I.scores.reduce((n, x) => n + x.s, 0);
  if (I.scores[0].s > 0) { I.arch = I.scores[0].a; I.conf = Math.round(100 * I.scores[0].s / total); }

  for (const [k, kws] of Object.entries(TOD_KW)) if (!I.tod && hitCount(text, kws)) I.tod = k;
  I.interior = hitCount(text, INTERIOR_KW) > 0;
  for (const [k, kws] of Object.entries(WEATHER_KW)) if (!I.weather && hitCount(text, kws)) I.weather = k;
  for (const [r, kws] of RATIO_KW) if (!I.ratio && hitCount(text, kws)) I.ratio = r;

  I.moves = Object.entries(MOVES).map(([k, m]) => [k, firstIdx(text, m.kw)]).filter(x => x[1] >= 0).sort((a, b) => a[1] - b[1]).map(x => x[0]);

  // dialogue: mask quotes, split, then hand the lines back to the beat they belong to
  const quotes = [];
  let work = text.replace(/[«“"„]([^«»“”"„\n]{2,240})[»”"“]/g, (m, q) => { quotes.push(q.trim()); return ` ⟦${quotes.length - 1}⟧. `; });
  work = work.replace(/^\s*(\d+)[.)]\s+/gm, '');
  const tsRe = /^(\d+(?:\.\d+)?)\s*[-–—]\s*(\d+(?:\.\d+)?)\s*(?:s|sec|с)?\s*[:.)\-–]\s*/iu;
  const shotRe = /^(?:shot|шот|кадр|сцена|scene)\s*\d+\s*[:.)\-–]\s*/iu;
  let pending = [];
  for (let part of work.split(SEQ_SPLIT)) {
    if (!part) continue;
    part = part.replace(/^[\s.,;:!?…–—-]+/u, '').replace(/^(?:потом|затем|после этого|а затем|далее|then|after that|afterwards|next|finally|в финале|в конце)[,:]?\s+/iu, '').trim();
    let t0 = null, t1 = null;
    const tm = tsRe.exec(part);
    if (tm) { t0 = +tm[1]; t1 = +tm[2]; part = part.slice(tm[0].length); }
    part = part.replace(shotRe, '');
    const lines = [];
    part = part.replace(/⟦(\d+)⟧/g, (m, i) => { lines.push(quotes[+i]); return ''; }).replace(/[\s:–—,.-]+$/u, '').trim();
    if (part.length < 3) {
      if (lines.length) (I.beats.length ? I.beats[I.beats.length - 1].lines : pending).push(...lines);
      continue;
    }
    I.beats.push({ text: dot(cap(part)), lines: pending.concat(lines), t0, t1 });
    pending = [];
  }
  I.userTimes = I.beats.length >= 2 && I.beats.every(b => b.t0 !== null) && I.beats.every((b, i) => i === 0 ? b.t0 === 0 : b.t0 === I.beats[i - 1].t1);
  I.quotes = quotes;
  return I;
}

/* ---------- 2. Build the prompt ---------- */
const GENRE_LIGHTS = new Set(['noir', 'cyber', 'horror', 'romantic', 'documentary', 'commercial']);

function build(S) {
  const L = LIM[S.ver];
  const I = decode(S.text || '');
  const notes = [];
  const note = (sev, en, ru) => notes.push({ sev, msg: [en, ru] });
  const dur = clamp(Math.round(S.dur) || L.min, L.min, L.max);
  const arch = S.arch && S.arch !== 'auto' ? ARCH.find(a => a.id === S.arch) : (I.arch || ARCH_DEFAULT);
  if (!I.beats.length) return { empty: true, intent: I, arch, dur, notes, prompt: '', shots: [] };

  // aspect ratio
  let ratio = S.ratio && S.ratio !== 'auto' ? S.ratio : (I.ratio || arch.ratio);
  const pr = parseRatio(ratio);
  if (!pr) { note('warn', `Aspect ratio "${ratio}" not understood; used ${arch.ratio}.`, `Формат «${ratio}» не распознан; взят ${arch.ratio}.`); ratio = arch.ratio; }
  else if (S.ver === '2.5' && (pr.v < 0.4 || pr.v > 2.5)) { note('warn', 'Seedance 2.5 accepts ratios from 0.4 to 2.5; using 16:9.', 'Seedance 2.5 принимает форматы от 0.4 до 2.5; взят 16:9.'); ratio = '16:9'; }
  else if (S.ver === '2.0' && !L.ratios.includes(pr.s)) { note('warn', `Seedance 2.0 supports ${L.ratios.join(', ')}; using ${arch.ratio}.`, `Seedance 2.0 поддерживает ${L.ratios.join(', ')}; взят ${arch.ratio}.`); ratio = arch.ratio; }
  else ratio = pr.s;

  // shots
  let beats = I.beats.map(b => ({ ...b, lines: b.lines.slice() }));
  const maxN = Math.max(1, Math.min(L.maxShots, Math.floor(dur / 2)));
  while (beats.length > maxN) {
    let bi = 0, bl = Infinity;
    for (let i = 0; i < beats.length - 1; i++) { const l = beats[i].text.length + beats[i + 1].text.length; if (l < bl) { bl = l; bi = i; } }
    beats.splice(bi, 2, { text: beats[bi].text.replace(/\.$/, '') + '; then ' + lowFirst(beats[bi + 1].text), lines: beats[bi].lines.concat(beats[bi + 1].lines), t0: null, t1: null });
    if (beats.length === maxN) note('warn', `${I.beats.length} events do not fit ${dur} s in ${maxN} shots; neighbouring events were merged (one action per shot is safer).`, `${I.beats.length} событий не помещаются в ${dur} с на ${maxN} шотов; соседние события объединены (одно действие на шот надёжнее).`);
  }
  const n = beats.length;
  let durs;
  if (I.userTimes && n === I.beats.length && beats[n - 1].t1 === dur) durs = beats.map(b => b.t1 - b.t0);
  else {
    if (I.userTimes && n === I.beats.length) note('info', 'Your own timings were scaled to the chosen duration.', 'Твои тайминги пропорционально подогнаны под выбранную длительность.');
    const w = beats.map(b => I.userTimes && b.t0 !== null ? b.t1 - b.t0 : Math.max(6, words(b.text)));
    durs = allocate(w, dur, 2) || allocate(w, dur, 1);
  }
  const shots = [];
  let t = 0;
  const forced = S.move && S.move !== 'auto' ? [S.move] : null;
  beats.forEach((b, i) => {
    const size = pick(arch.sizes, i, n);
    const mid = forced ? forced[0] : I.moves[i];
    const move = mid ? MOVES[mid].p : pick(arch.moves, i, n);
    shots.push({ n: i + 1, t0: t, t1: t + durs[i], size, move, mid: mid || null, text: b.text, lines: b.lines });
    t += durs[i];
  });

  // references
  const ctr = { image: 0, video: 0, audio: 0 };
  const refLines = [], refTokens = [];
  let hasCharacter = false, hasFace = false;
  (S.refs || []).forEach(r => {
    const role = ROLES[r.role];
    if (!role || (role.ver && role.ver !== S.ver)) return;
    ctr[role.kind]++;
    const tok = '@' + cap(role.kind) + ctr[role.kind];
    refTokens.push(tok + ' (' + role.l[0] + ')');
    const nn = (r.note || '').trim();
    refLines.push(role.f(tok, nn ? ` (${nn})` : ''));
    if (r.role === 'character' || r.role === 'product') hasCharacter = true;
    if (r.role === 'character') hasFace = true;
  });
  const cnt = ctr.image + ctr.video + ctr.audio;
  if (ctr.image > L.img) note('err', `Too many images: ${ctr.image} of ${L.img} allowed in ${S.ver}.`, `Слишком много картинок: ${ctr.image} из ${L.img} для ${S.ver}.`);
  if (ctr.video > L.vid) note('err', `Too many videos: ${ctr.video} of ${L.vid} allowed in ${S.ver}.`, `Слишком много видео: ${ctr.video} из ${L.vid} для ${S.ver}.`);
  if (ctr.audio > L.aud) note('err', `Too many audio files: ${ctr.audio} of ${L.aud} allowed in ${S.ver}.`, `Слишком много аудио: ${ctr.audio} из ${L.aud} для ${S.ver}.`);
  if (cnt > L.total) note('err', `Total files ${cnt} exceeds the ${L.total} limit of ${S.ver}.`, `Всего файлов ${cnt} при лимите ${L.total} в ${S.ver}.`);
  if (hasFace) note('info', S.ver === '2.5' ? 'Seedance 2.5 rejects real faces in references; use an illustrated or AI-generated character.' : 'Seedance 2.0 may reject photos of real people; use an illustrated or AI-generated character.', S.ver === '2.5' ? 'Seedance 2.5 отклоняет реальные лица в референсах; используй нарисованного или AI-персонажа.' : 'Seedance 2.0 может отклонить фото реальных людей; используй нарисованного или AI-персонажа.');

  // look
  const bodyKey = S.body && S.body !== 'auto' ? S.body : arch.body;
  const cap_ = { lean: 2, std: 4, rich: 5 }[S.detail || 'std'];
  const lookParts = [];
  for (const k of arch.look) {
    if (lookParts.length >= cap_) break;
    const s = k === 'body' ? BODY[bodyKey] : k === 'color' ? COLOR[arch.color] : BLOCK[k];
    if (s) lookParts.push(s);
  }
  const look = (lookParts.length ? dot(lookParts.join('; ')) + ' ' : '') + cap(arch.style);

  // light
  let lk = S.light && S.light !== 'auto' ? [S.light] : [];
  if (!lk.length) {
    let base = null;
    if (I.tod) {
      base = I.tod;
      if (I.interior && (I.tod === 'night' || I.tod === 'eveningGolden')) base = 'intNight';
      else if (I.interior && I.tod !== 'studio') base = 'intDay';
    } else if (I.interior && !GENRE_LIGHTS.has(arch.light)) base = 'intDay';
    if (base) { lk.push(base); if (GENRE_LIGHTS.has(arch.light)) lk.push(arch.light); }
    else lk.push(arch.light);
    if (I.weather) lk.push(I.weather);
  }
  const light = lk.map(k => LIGHT[k]).join('; ');

  // audio
  const br = S.brackets !== false;
  const manual = (S.dialogue || '').split('\n').map(s => s.trim()).filter(Boolean);
  const allLines = manual.concat(...shots.map(s => s.lines));
  let dl = S.dlang || 'auto';
  if (dl === 'auto') dl = /[а-яё]/i.test(allLines.join(' ')) ? 'ruuk' : 'en';
  const DL = { en: 'English', ru: 'Russian', ruuk: 'Ukrainian language (the spoken text is Russian)', zh: 'Mandarin Chinese', es: 'Spanish', de: 'German', fr: 'French' };
  const aud = [];
  const music = (S.music || '').trim(), sfx = (S.sfx || '').trim();
  if (music && !S.nobgm) aud.push(br ? `(${music})` : `Music: ${music}.`);
  if (sfx) aud.push(br ? `<${sfx}>` : `Sound effects: ${sfx}.`);
  if (manual.length) aud.push('Dialogue: ' + manual.map(q => br ? `{"${q}"}` : `"${q}"`).join(' '));
  if (allLines.length) aud.unshift(`Dialogue language: ${DL[dl] || dl}; one language only.`);
  if (S.nobgm) aud.push('No background music.');
  if (S.nosubs !== false && allLines.length) aud.push('No subtitles.');
  if (S.nobgm && music) note('warn', '"No BGM" is on, so the music description was left out.', 'Включено «без музыки», поэтому описание музыки не вошло в промпт.');

  const fmtLine = s => {
    const lines = s.lines.map(q => br ? `{"${q}"}` : `Says: "${q}".`).join(' ');
    return lines;
  };

  // stage lines
  const stageWord = S.ver === '2.5' ? 'stage' : 'shot';
  const hdr = `Total: ${dur} seconds, ${ratio}, 24 fps, ${n === 1 ? '1 continuous shot' : n + ' ' + stageWord + 's'}.`;
  const stageLines = shots.map((s, i) => {
    const label = S.ver === '2.5' ? `${s.t0}-${s.t1}s:` : (S.times ? `Shot ${s.n} (${s.t0}-${s.t1}s):` : `Shot ${s.n}:`);
    let body = `${s.size}, ${s.move}. ${s.text}`;
    if (s.lines.length) body += ' ' + fmtLine(s);
    if (S.ver === '2.5' && S.endState !== false) {
      if (i < n - 1) body += ` Ends in a settled ${lowFirst(pick(arch.sizes, i + 1, n))}.`;
      else body += ' Holds a clean final frame.';
    }
    s.line = `${label} ${body}`;
    return s.line;
  });
  if (n === 1) {
    const only = shots[0];
    only.line = only.line.replace(/^Shot 1(?: \([^)]*\))?:/, S.ver === '2.5' ? '' : 'Shot 1:').trim();
  }

  // constraints
  const cons = CONS[S.cons || 2].filter((c, i) => i > 0 || hasCharacter).concat(arch.cons);
  const neg = (S.neg || '').split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
  const consLine = 'Constraints: ' + cons.concat(neg).join(', ') + '.';

  // assemble
  const first = beats.slice(0, 2).map(b => b.text.replace(/\.$/, '')).join('; ');
  const summary = 'Summary: ' + dot(first.split(/\s+/).slice(0, 30).join(' '));
  const blocks = [];
  blocks.push([hdr].concat(refLines).join('\n'));
  if (S.ver === '2.5') {
    blocks.push([summary, 'Look: ' + look, 'Lighting: ' + dot(light)].join('\n'));
    blocks.push(stageLines.join('\n'));
  } else {
    blocks.push(stageLines.join('\n'));
    blocks.push(['Style: ' + look, 'Lighting: ' + dot(light)].join('\n'));
  }
  if (aud.length) blocks.push('Audio: ' + aud.join(' '));
  blocks.push(consLine);
  const prompt = blocks.join('\n\n');

  // advice
  if (n === 1 && words(beats[0].text) < 14 && dur > 8) note('info', `One event for ${dur} s: the clip is generated as a single continuous take. Add 2-3 events if you want cuts.`, `Одно событие на ${dur} с: ролик получится одним непрерывным кадром. Добавь 2–3 события, если нужны склейки.`);
  if (durs.some(d => d > 8)) note('info', 'A stage longer than 8 s is risky; split it into two events.', 'Отрезок длиннее 8 с рискован; раздели его на два события.');
  if (I.lang === 'ru') note('info', 'Scaffolding is in English, your wording stays as written. For a full English prompt use the LLM tab (Mode 3).', 'Каркас на английском, твои формулировки остаются как есть. Для полностью английского промпта используй вкладку LLM (режим 3).');
  if (allLines.length && !music && !sfx) note('info', 'Dialogue found. Add ambient sound or music for a fuller track.', 'Найдена речь. Добавь фоновые звуки или музыку, чтобы дорожка звучала полнее.');
  if (!cnt && /@(?:image|img)/i.test(S.text)) note('warn', 'Your text mentions @Image but no reference is attached in the References panel.', 'В тексте есть @Image, но референс не добавлен в панель «Референсы».');
  note('tip', arch.tip[0], arch.tip[1]);

  const R = { prompt, shots, intent: I, arch, dur, ratio, light: lk, notes, n, refCount: cnt, refTokens, hdr };
  R.audit = lint(prompt, S.ver, dur);
  return R;
}

/* ---------- 3. Audit / linter ---------- */
const MV_RE = [['whip', /whip[- ]pan/i], ['orbit', /\borbit|arc shot|orbital/i], ['dolly', /\bdolly|push[- ]in|pull[- ]back/i], ['pan', /\bpan\b/i], ['tilt', /\btilt/i],
  ['crane', /\bcrane/i], ['handheld', /hand-?held/i], ['tracking', /tracking|\btruck\b/i], ['zoom', /\bzoom/i], ['static', /locked tripod|static camera|no camera movement/i], ['aerial', /aerial|drone/i]];

function lint(p, ver, dur) {
  const L = LIM[ver], out = [];
  const add = (sev, id, en, ru) => out.push({ sev, id, msg: [en, ru] });
  if (!p || !p.trim()) return { issues: [], score: 0 };
  const chars = p.length, wc = words(p);
  if (chars > L.chars) add('warn', 'len', `${chars} characters; the recommended cap for ${ver} is about ${L.chars}. Trim secondary detail.`, `${chars} символов; рекомендуемый потолок для ${ver} около ${L.chars}. Убери второстепенное.`);
  if (wc < 35) add('tip', 'thin', 'Very short prompt: add subject detail, camera and a physical light source.', 'Очень короткий промпт: добавь детали героя, камеру и физический источник света.');

  const slop = SLOP.filter(w => new RegExp('(?<![\\p{L}\\p{N}])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + (/[а-яё]/i.test(w) ? '' : '(?![\\p{L}\\p{N}])'), 'iu').test(p));
  if (slop.length) add('warn', 'slop', `Empty quality words: ${slop.join(', ')}. They add nothing; replace with camera, film, lens or light specifics.`, `Пустые слова качества: ${slop.join(', ')}. Они ничего не дают; замени конкретикой: камера, плёнка, оптика, свет.`);

  // stages
  const stages = [];
  let cur = null;
  const startRe = /^\s*(?:(\d+(?:\.\d+)?)\s*[-–—]\s*(\d+(?:\.\d+)?)\s*(?:s|sec|с)(?![\p{L}\p{N}])|shot\s*(\d+))/iu;
  const sectionRe = /^\s*(audio|constraints?|style|look|lighting|total|summary|music|sfx|sound|dialogue|avoid)\b/i;
  for (const line of p.split('\n')) {
    const m = startRe.exec(line);
    if (m) {
      let t0 = null, t1 = null;
      if (m[1] !== undefined) { t0 = +m[1]; t1 = +m[2]; }
      else { const r = /(\d+(?:\.\d+)?)\s*[-–—]\s*(\d+(?:\.\d+)?)\s*s/i.exec(line); if (r) { t0 = +r[1]; t1 = +r[2]; } }
      cur = { text: line, t0, t1, shot: m[3] !== undefined };
      stages.push(cur);
    } else if (sectionRe.test(line) || !line.trim()) cur = null;
    else if (cur) cur.text += ' ' + line;
  }
  const timed = stages.filter(s => s.t0 !== null);
  if (ver === '2.5') {
    if (!stages.length && (dur || 0) > 8) add('tip', 'ts', 'Seedance 2.5 reads second-level timestamps: split the plot into "0-5s:", "5-10s:" lines.', 'Seedance 2.5 понимает посекундные тайминги: разбей сюжет на строки «0-5s:», «5-10s:».');
    if (timed.length) {
      if (timed[0].t0 !== 0) add('err', 'ts0', 'Timeline must start at 0s.', 'Таймлайн должен начинаться с 0s.');
      for (let i = 1; i < timed.length; i++) if (timed[i].t0 !== timed[i - 1].t1) { add('err', 'tsgap', `Gap or overlap between stages ${i} and ${i + 1}: use consecutive ranges.`, `Дыра или нахлёст между отрезками ${i} и ${i + 1}: диапазоны должны идти подряд.`); break; }
      if (timed.some(s => s.t0 % 1 || s.t1 % 1)) add('warn', 'tsdec', 'Use whole seconds in timestamps.', 'Используй целые секунды в таймингах.');
      if (dur && timed[timed.length - 1].t1 !== dur) add('err', 'tsend', `Timeline ends at ${timed[timed.length - 1].t1}s but the duration is ${dur}s.`, `Таймлайн заканчивается на ${timed[timed.length - 1].t1}s, а длительность ${dur}s.`);
      if (timed.length > L.maxShots) add('warn', 'tsmany', `${timed.length} stages; more than ${L.maxShots} gets crowded.`, `${timed.length} отрезков; больше ${L.maxShots} уже тесно.`);
      if (timed.some(s => s.t1 - s.t0 < 2)) add('warn', 'tsshort', 'A stage under 2 s is too short for a state change plus an end state.', 'Отрезок короче 2 с слишком короткий для действия и конечного состояния.');
    }
  } else {

function setDur(v) { const L_ = LIM[VER]; v = clamp(Math.round(v) || L_.min, L_.min, L_.max); $('dur').value = v; $('durNum').value = v; }

/* ---------- version / language ---------- */
function setVer(v, silent) {
  VER = v;
  $$('#verSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  const lim = LIM[v];
  for (const id of ['dur', 'durNum']) { $(id).min = lim.min; $(id).max = lim.max; }
  setDur(+$('durNum').value);
  const prev = ratioVal();
  const sel = $('ratio');
  sel.innerHTML = `<option value="auto">${esc(t('auto'))}</option>` + lim.ratios.map(r => `<option>${r}</option>`).join('') + (v === '2.5' ? `<option value="custom">${esc(t('custom'))}</option>` : '');
  sel.value = [...sel.options].some(o => o.value === prev) ? prev : 'auto';
  $('ratioCustom').hidden = sel.value !== 'custom';
  $('timesWrap').hidden = v !== '2.0';
  $('endWrap').hidden = v !== '2.5';
  REFS.forEach(r => { const ro = ROLES[r.role]; if (ro && ro.ver && ro.ver !== v) r.role = ro.kind === 'video' ? 'vmotion' : 'character'; });
  if (!silent) { renderRefs(); render(); }
}
function rebuildSelects() {
  const fill = (id, html) => { const el = $(id), prev = el.value; el.innerHTML = html; if ([...el.options].some(o => o.value === prev)) el.value = prev; };
  const o = (v, n) => `<option value="${v}">${esc(n)}</option>`;
  fill('arch', o('auto', t('auto')) + ARCH.map(a => o(a.id, L(a.n))).join(''));
  fill('light', o('auto', t('auto')) + Object.keys(LIGHT_NAMES).map(k => o(k, L(LIGHT_NAMES[k]))).join(''));
  fill('body', o('auto', t('auto')) + Object.keys(BODY_NAMES).map(k => o(k, BODY_NAMES[k])).join('') + o('phone', t('b_phone')) + o('none', t('b_none')));
  fill('move', o('auto', t('auto')) + Object.keys(MOVES).map(k => o(k, L(MOVES[k].n))).join(''));
  const r = $('ratio'); if (r.options[0]) r.options[0].textContent = t('auto');
  if (r.querySelector('option[value=custom]')) r.querySelector('option[value=custom]').textContent = t('custom');
}
function applyLang() {
  document.documentElement.lang = LANG;
  $$('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $$('[data-tp]').forEach(el => { el.placeholder = t(el.dataset.tp); });
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === LANG));
  rebuildSelects(); renderExamples(); renderRefs(); render(); renderHist(); renderImprove();
}

/* ---------- references ---------- */
function renderRefs() {
  const ctr = { image: 0, video: 0, audio: 0 };
  const roles = Object.entries(ROLES).filter(([, r]) => !r.ver || r.ver === VER);
  $('refs').innerHTML = REFS.map((r, i) => {
    const ro = ROLES[r.role] || ROLES.character;
    ctr[ro.kind]++;
    const opts = ['image', 'video', 'audio'].map(k => `<optgroup label="${esc(t('g_' + k))}">` + roles.filter(([, x]) => x.kind === k).map(([id, x]) => `<option value="${id}"${id === r.role ? ' selected' : ''}>${esc(L(x.l))}</option>`).join('') + '</optgroup>').join('');
    return `<div class="ref" data-i="${i}"><span class="tok">@${cap(ro.kind)}${ctr[ro.kind]}</span><select aria-label="role">${opts}</select><input type="text" value="${esc(r.note)}" placeholder="${esc(t('ph_refnote'))}"><button type="button" class="x" aria-label="remove">×</button></div>`;
  }).join('');
  $('refCount').textContent = REFS.length ? `${REFS.length} / ${LIM[VER].total} ${t('files')}` : '';
}

/* ---------- compile & render ---------- */
function schedule() { clearTimeout(timer); timer = setTimeout(render, 140); }
function render() {
  S = readUI();
  R = build(S);
  store.set('sdc.state', { ...S, lang: LANG });
  renderUnderstood(); renderOutputs(); renderAudit(); renderNotes();
}
function chip(label, val, cls) { return `<span class="chip ${cls || ''}">${esc(label)} <b>${esc(val)}</b></span>`; }
function renderUnderstood() {
  const I = R.intent, out = [];
  out.push(chip(t('u_arch'), `${L(R.arch.n)}${I.arch ? ' · ' + I.conf + '%' : ''}`, I.arch ? '' : 'dim'));
  if (I.dur) out.push(I.dur !== R.dur && I.dur >= LIM[VER].min && I.dur <= LIM[VER].max ? `<button type="button" class="chip" data-apply="${I.dur}">${esc(t('u_dur'))} <b>${I.dur} s</b> → ${esc(t('u_apply'))}</button>` : chip(t('u_dur'), I.dur + ' s'));
  if (!R.empty) {
    out.push(chip(t('u_ratio'), `${R.ratio} · ${R.dur} s`));
    out.push(chip(t('u_light'), R.light.map(k => L(LIGHT_NAMES[k] || WEATHER_NAMES[k] || [k, k])).join(' + ')));
    out.push(chip(t('u_moves'), I.moves.length ? I.moves.map(m => L(MOVES[m].n)).join(' → ') : t('u_cam_auto'), I.moves.length ? '' : 'dim'));
    out.push(chip(t('u_shots'), `${R.n} ${VER === '2.5' ? t('u_stage_w') : t('u_shot_w')}`));
    const lines = R.shots.reduce((n, s) => n + s.lines.length, 0) + (S.dialogue.trim() ? S.dialogue.trim().split('\n').length : 0);
    if (lines) out.push(chip(t('u_dlg'), `${lines} ${t('u_lines')}`));
  }
  out.push(chip(t('u_lang'), I.lang.toUpperCase(), 'dim'));
  $('understood').innerHTML = out.join('');
}
function jsonOut() {
  return JSON.stringify({ tool: 'MiSE', model: 'Seedance ' + S.ver, duration_s: R.dur, aspect_ratio: R.ratio, scene_type: R.arch.id,
    shots: R.shots.map(s => ({ n: s.n, start_s: s.t0, end_s: s.t1, shot_size: s.size, camera: s.move, action: s.text, dialogue: s.lines })),
    references: S.refs.filter(r => ROLES[r.role] && (!ROLES[r.role].ver || ROLES[r.role].ver === S.ver)).map(r => ({ kind: ROLES[r.role].kind, role: r.role, note: r.note })),
    prompt: R.prompt, audit: { score: R.audit.score, issues: R.audit.issues.map(i => ({ severity: i.sev, id: i.id, message: i.msg[0] })) } }, null, 2);
}
function renderOutputs() {
  const empty = !!R.empty;
  $('outPrompt').textContent = empty ? t('empty_out') : R.prompt;
  $('outPrompt').style.color = empty ? 'var(--mute)' : '';
  const lim = LIM[VER];
  $('stats').textContent = empty ? '' : `${R.prompt.length} / ${R.prompt.split(/\s+/).filter(Boolean).length} ${LANG === 'ru' ? 'симв. / слов' : 'chars / words'}`;
  $('limit').textContent = empty ? '' : `${LANG === 'ru' ? 'рекомендуемо до' : 'recommended up to'} ${lim.chars}`;
  $('meter').className = 'meter' + (!empty && R.prompt.length > lim.chars ? ' over' : '');
  $('meter').firstElementChild.style.width = empty ? '0' : Math.min(100, R.prompt.length / lim.chars * 100) + '%';
  $('tlBar').innerHTML = empty ? '' : R.shots.map(s => `<div style="flex:${s.t1 - s.t0}" title="${esc(s.size)}"><b>${s.t0}–${s.t1}s</b><span>${esc(s.size)}</span></div>`).join('');
  $('tlList').innerHTML = empty ? `<p class="empty">${esc(t('empty_out'))}</p>` : R.shots.map(s => `<div class="shot"><span class="t">${s.t0}–${s.t1}s</span>${esc(s.size)} · ${esc(s.move)}<br>${esc(s.text)}${s.lines.length ? '<br><i>' + esc(s.lines.map(q => '“' + q + '”').join(' ')) + '</i>' : ''}</div>`).join('');
  $('outLlm').textContent = empty ? t('empty_out') : buildMeta(S, R, LANG);
  $('outJson').textContent = empty ? t('empty_out') : jsonOut();
}
function issueList(el, scoreEl, audit) {
  const sc = audit.score;
  scoreEl.textContent = audit.issues.length || sc ? sc + ' / 100' : '';
  scoreEl.className = 'score ' + (sc >= 85 ? 'hi' : sc >= 60 ? 'mid' : 'lo');
  el.innerHTML = audit.issues.length ? audit.issues.map(i => `<li><span class="dot ${i.sev}"></span><span>${esc(L(i.msg))}</span></li>`).join('') : `<li><span class="dot" style="background:var(--ok)"></span><span>${esc(t('no_issues'))}</span></li>`;
}
function renderAudit() { if (R.empty) { $('score').textContent = ''; $('score').className = 'score'; $('issues').innerHTML = ''; } else issueList($('issues'), $('score'), R.audit); }
function renderNotes() {
  const n = R.notes.filter(x => !(R.empty && x.sev === 'tip'));
  $('notesCard').hidden = !n.length;
  $('notes').innerHTML = n.map(x => `<li><span class="dot ${x.sev}"></span><span>${esc(L(x.msg))}</span></li>`).join('');
}

/* ---------- examples, copy, export ---------- */
function renderExamples() {
  $('examples').innerHTML = EXAMPLES.map((e, i) => `<button type="button" class="chip" data-ex="${i}">${esc(L(e.n))} · ${e.ver}</button>`).join('');
}
function loadExample(i) {
  const e = EXAMPLES[i];
  const s = { ...readUI(), ver: e.ver, text: L(e.text), dur: e.dur, refs: e.refs, music: e.music || '', sfx: e.sfx || '', dialogue: '', arch: 'auto', ratio: 'auto', light: 'auto', move: 'auto', body: 'auto', neg: '' };
  writeUI(s); render();
}
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) { /* no clipboard */ } ta.remove(); }
  toast(t('copied'));
}
function download(name, txt, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function currentText() { return OUT === 'llm' ? $('outLlm').textContent : OUT === 'json' ? $('outJson').textContent : R.prompt; }
function fileStem() { return `seedance-${S.ver.replace('.', '')}-${R.dur}s`; }

/* ---------- history ---------- */
const hist = { get: () => store.get('sdc.hist', []), set: v => store.set('sdc.hist', v.slice(0, 60)) };
function saveHist(silent) {
  if (!R || R.empty) return;
  const h = hist.get();
  if (h[0] && h[0].prompt === R.prompt) { if (!silent) toast(t('saved')); return; }
  h.unshift({ id: Date.now(), ts: new Date().toISOString(), ver: S.ver, state: S, prompt: R.prompt, fav: false });
  hist.set(h); renderHist(); if (!silent) toast(t('saved'));
}
function renderHist() {
  const only = $('favOnly').checked;
  const h = hist.get().filter(x => !only || x.fav);
  $('hist').innerHTML = h.length ? h.map(x => `<div class="it" data-id="${x.id}">
    <div class="meta"><span class="badge">Seedance ${esc(x.ver)}</span><span>${esc(new Date(x.ts).toLocaleString(LANG === 'ru' ? 'ru-RU' : 'en-GB'))}</span><span>${x.state.dur} s</span></div>
    <div>${esc(x.state.text.slice(0, 160))}${x.state.text.length > 160 ? '…' : ''}</div>
    <div class="acts" style="margin:0"><button type="button" class="btn sm" data-a="open">${esc(t('h_load'))}</button><button type="button" class="btn ghost sm" data-a="copy">${esc(t('btn_copy'))}</button><button type="button" class="btn ghost sm" data-a="fav" aria-pressed="${x.fav}">${x.fav ? '★' : '☆'}</button><button type="button" class="btn ghost sm" data-a="del">${esc(t('h_del'))}</button></div></div>`).join('')
    : `<p class="empty">${esc(t('h_empty'))}</p>`;
}

/* ---------- improve mode ---------- */
let impAudit = null;
function renderImprove() {
  const p = $('impText').value, dur = +$('impDur').value || null;
  if (!p.trim()) { $('impIssues').innerHTML = ''; $('impScore').textContent = ''; $('impScore').className = 'score'; $('impMeta').textContent = ''; impAudit = null; return; }
  impAudit = lint(p, VER, dur);
  issueList($('impIssues'), $('impScore'), impAudit);
  $('impMeta').textContent = buildImproveMeta(p, VER, dur || '?', impAudit.issues, LANG);
}

/* ---------- share link ---------- */
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = s => JSON.parse(decodeURIComponent(escape(atob(s))));

/* ---------- wiring ---------- */
function setMode(m) {
  MODE = m;
  $$('#modeTabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
  for (const p of ['compile', 'improve', 'history']) $('pane-' + p).hidden = p !== m;
  if (m === 'improve') renderImprove();
  if (m === 'history') renderHist();
}
function setOut(o) {
  OUT = o;
  $$('#outTabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.o === o));
  for (const p of ['prompt', 'tl', 'llm', 'json']) $('o-' + p).hidden = p !== o;
}

function init() {
  const saved = store.get('sdc.state', null);
  LANG = (saved && saved.lang) || (/^ru|^uk|^be/i.test(navigator.language || '') ? 'ru' : 'en');
  let initial = saved;
  const m = /#s=([^&]+)/.exec(location.hash);
  if (m) { try { initial = dec(m[1]); } catch (e) { /* bad link */ } }
  rebuildSelects(); setVer((initial && initial.ver) || '2.5', true);
  $$('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $$('[data-tp]').forEach(el => { el.placeholder = t(el.dataset.tp); });
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === LANG));
  rebuildSelects(); renderExamples();
  if (initial && initial.text) writeUI(initial); else { setVer('2.5', true); loadExampleSilently(); }
  applyLang();

  $$('.lang button').forEach(b => b.addEventListener('click', () => { LANG = b.dataset.l; applyLang(); }));
  $$('#verSeg button').forEach(b => b.addEventListener('click', () => { setVer(b.dataset.v); renderImprove(); }));
  $$('#modeTabs button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));
  $$('#outTabs button').forEach(b => b.addEventListener('click', () => setOut(b.dataset.o)));

  $('dur').addEventListener('input', () => { $('durNum').value = $('dur').value; schedule(); });
  $('durNum').addEventListener('input', () => { const v = clamp(+$('durNum').value || 0, LIM[VER].min, LIM[VER].max); if ($('durNum').value) $('dur').value = v; schedule(); });
  $('durNum').addEventListener('change', () => { setDur(+$('durNum').value); schedule(); });
  $('ratio').addEventListener('change', () => { $('ratioCustom').hidden = $('ratio').value !== 'custom'; schedule(); });
  for (const id of ['desc', 'ratioCustom', 'arch', 'detail', 'cons', 'body', 'light', 'move', 'music', 'sfx', 'dialogue', 'dlang', 'nosubs', 'nobgm', 'times', 'endState', 'brackets', 'neg'])
    for (const ev of ['input', 'change']) $(id).addEventListener(ev, schedule);

  $('addRef').addEventListener('click', () => { REFS.push({ role: 'character', note: '' }); renderRefs(); render(); });
  $('refs').addEventListener('change', e => { const row = e.target.closest('.ref'); if (row && e.target.tagName === 'SELECT') { REFS[+row.dataset.i].role = e.target.value; renderRefs(); render(); } });
  $('refs').addEventListener('input', e => { const row = e.target.closest('.ref'); if (row && e.target.tagName === 'INPUT') { REFS[+row.dataset.i].note = e.target.value; schedule(); } });
  $('refs').addEventListener('click', e => { if (e.target.classList.contains('x')) { REFS.splice(+e.target.closest('.ref').dataset.i, 1); renderRefs(); render(); } });

  $('examples').addEventListener('click', e => { const b = e.target.closest('[data-ex]'); if (b) loadExample(+b.dataset.ex); });
  $('understood').addEventListener('click', e => { const b = e.target.closest('[data-apply]'); if (b) { setDur(+b.dataset.apply); render(); } });

  $('bCopy').addEventListener('click', () => { if (R.empty) return; copyText(currentText()); saveHist(true); });
  $('bTxt').addEventListener('click', () => { if (R.empty) return; download(fileStem() + '.txt', R.prompt, 'text/plain'); saveHist(true); });
  $('bJson').addEventListener('click', () => { if (R.empty) return; download(fileStem() + '.json', jsonOut(), 'application/json'); saveHist(true); });
  $('bLink').addEventListener('click', () => { copyText(location.origin === 'null' ? location.href.split('#')[0] + '#s=' + enc(S) : location.origin + location.pathname + '#s=' + enc(S)); toast(t('linkcopied')); });
  $('bSave').addEventListener('click', () => saveHist(false));

  $('hist').addEventListener('click', e => {
    const btn = e.target.closest('[data-a]'); if (!btn) return;
    const id = +btn.closest('.it').dataset.id, h = hist.get(), item = h.find(x => x.id === id);
    if (!item) return;
    if (btn.dataset.a === 'open') { writeUI(item.state); setMode('compile'); render(); window.scrollTo(0, 0); }
    else if (btn.dataset.a === 'copy') copyText(item.prompt);
    else if (btn.dataset.a === 'fav') { item.fav = !item.fav; hist.set(h); renderHist(); }
    else if (btn.dataset.a === 'del') { hist.set(h.filter(x => x.id !== id)); renderHist(); }
  });
  $('favOnly').addEventListener('change', renderHist);
  $('histClear').addEventListener('click', () => { if (confirm(t('h_confirm'))) { hist.set([]); renderHist(); } });

  $('impText').addEventListener('input', renderImprove);
  $('impDur').addEventListener('input', renderImprove);
  $('impStrip').addEventListener('click', () => { $('impText').value = stripSlop($('impText').value); renderImprove(); });
  $('impCons').addEventListener('click', () => { $('impText').value = addConstraints($('impText').value); renderImprove(); });
  $('impCopy').addEventListener('click', () => copyText($('impText').value));
  $('impMetaCopy').addEventListener('click', () => copyText($('impMeta').textContent));
}
function loadExampleSilently() { const e = EXAMPLES[0]; writeUI({ ver: e.ver, text: L(e.text), dur: e.dur, refs: e.refs, music: e.music || '' }); }

document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
